<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nunchi &mdash; Read the Room</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d0e16">
<meta name="description" content="Nunchi: read the room to win the game. Top Ten, Fun Facts and Wavelength, on one phone or with everyone on their own.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d0e16'/%3E%3Cpath d='M10 44a22 22 0 0 1 44 0' fill='none' stroke='%23ff3d8b' stroke-width='7' stroke-linecap='round'/%3E%3Cpath d='M32 44 45 24' stroke='%23f4f5fb' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='44' r='5' fill='%23f4f5fb'/%3E%3C/svg%3E">
<style>
  :root{
    --ground:#0d0e16;
    --panel:#171a2b;
    --panel-2:#1f2438;
    --line:rgba(255,255,255,.10);
    --ink:#f4f5fb;
    --ink-dim:#a7adc6;
    --ink-faint:#6b7192;
    --good:#25c281;
    --miss:#ff6a5a;
    --m-rank:#ff3d8b;
    --m-lineup:#f5b301;
    --m-dial:#2fb7ff;
    --accent:#9b6bff;
    --accent-ink:#0d0e16;
    --display:"Arial Black","Helvetica Neue Bold","Helvetica Neue",Helvetica,Arial,sans-serif;
    --body:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:var(--ground);color:var(--ink);font-family:var(--body);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  body[data-mode="rank"]{--accent:var(--m-rank)}
  body[data-mode="lineup"]{--accent:var(--m-lineup)}
  body[data-mode="dial"]{--accent:var(--m-dial)}
  button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none;font-size:inherit}
  button:disabled{opacity:.4;cursor:not-allowed}
  button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:14px}
  input{font-family:inherit}

  .app{max-width:540px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
    padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));position:relative}
  .flood{position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(120% 70% at 50% -12%, color-mix(in srgb,var(--accent) 38%, transparent), transparent 70%),
      linear-gradient(180deg, color-mix(in srgb,var(--accent) 9%, var(--ground)), var(--ground) 60%);
    transition:background .4s ease}
  .screen{flex:1;display:flex;flex-direction:column;gap:14px;animation:rise .28s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* type */
  .display{font-family:var(--display);font-weight:900;text-transform:uppercase;letter-spacing:-.03em;line-height:.9}
  .eyebrow{color:var(--ink-faint);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
  .dim{color:var(--ink-dim)}
  .faint{color:var(--ink-faint)}
  .center{text-align:center}
  .small{font-size:13px}
  h2{margin:0}

  /* brand */
  .brand{padding:10px 2px 4px}
  .brand h1{font-family:var(--display);font-weight:900;margin:0;line-height:.86;font-size:clamp(56px,19vw,92px);letter-spacing:-.05em;text-transform:uppercase}
  .brand h1 i{font-style:normal;color:var(--m-rank)}
  .brand .ko{font-size:15px;color:var(--ink-dim);margin-top:10px}
  .brand .ko b{color:var(--ink);font-weight:700}

  /* mode cards */
  .modes{display:flex;flex-direction:column;gap:12px}
  .mode{position:relative;overflow:hidden;border-radius:22px;padding:18px 18px 18px 22px;background:var(--panel);
    border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:6px;
    transition:transform .12s ease}
  .mode:active{transform:scale(.98)}
  .mode .swatch{position:absolute;inset:0 auto 0 0;width:7px;background:var(--mc)}
  .mode .blob{position:absolute;top:-50px;right:-40px;width:150px;height:150px;border-radius:50%;background:var(--mc);opacity:.16;filter:blur(6px)}
  .mode .name{font-family:var(--display);font-weight:900;font-size:30px;letter-spacing:-.03em;text-transform:uppercase;color:var(--mc);position:relative;line-height:1}
  .mode .pitch{position:relative;color:var(--ink);font-size:15px;line-height:1.35}
  .pill{font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:4px 9px;border-radius:999px;background:var(--panel-2);color:var(--ink-dim);border:1px solid var(--line)}

  /* buttons */
  .cta{width:100%;padding:18px;border-radius:20px;background:var(--accent);color:var(--accent-ink);
    font-family:var(--display);font-weight:900;font-size:19px;letter-spacing:.02em;text-transform:uppercase;
    box-shadow:0 12px 30px -12px color-mix(in srgb,var(--accent) 75%,transparent);transition:transform .1s ease}
  .cta:active{transform:translateY(2px) scale(.99)}
  .cta.alt{background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:none}
  .cta .sub{display:block;font-family:var(--body);font-weight:600;text-transform:none;letter-spacing:0;font-size:13px;opacity:.75;margin-top:4px}
  .ghost{padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink-dim);font-weight:700;font-size:13px}
  .ghost:active{transform:scale(.96)}
  .ghost.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  .link{color:var(--accent);font-weight:700;font-size:14px;padding:6px 2px}
  .row{display:flex;gap:10px;align-items:center}
  .row.wrap{flex-wrap:wrap}
  .grow{flex:1}
  .stack{display:flex;flex-direction:column;gap:10px}
  .bottom{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:12px}
  .topback{align-self:flex-start;color:var(--ink-dim);font-weight:700;font-size:14px;padding:6px 2px}

  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
  .seg button{padding:8px 13px;border-radius:999px;font-weight:700;font-size:14px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

  /* panels */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px}
  .card.tint{background:color-mix(in srgb,var(--accent) 10%,var(--panel));border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
  .rules{margin:0;padding:0;list-style:none;counter-reset:r;display:flex;flex-direction:column;gap:12px}
  .rules li{counter-increment:r;display:grid;grid-template-columns:30px 1fr;gap:10px;line-height:1.4;font-size:15px}
  .rules li::before{content:counter(r);width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
    font-family:var(--display);font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center}

  /* inputs */
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
  .inp{width:100%;padding:15px 16px;border-radius:16px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:17px}
  .inp:focus{outline:none;border-color:var(--accent)}
  .inp.code{font-family:var(--display);font-size:34px;letter-spacing:.3em;text-transform:uppercase;text-align:center;padding:12px}
  .inp.big{font-family:var(--display);font-size:34px;text-align:center;padding:14px}
  .err{color:var(--miss);font-size:14px;font-weight:600}

  /* players */
  .plist{display:flex;flex-direction:column;gap:8px}
  .p{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-weight:700}
  .p .dot{width:9px;height:9px;border-radius:50%;background:var(--good);flex:none}
  .p .dot.off{background:var(--ink-faint)}
  .p .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .p .you{color:var(--ink-faint);font-weight:600;font-size:12px}
  .p .x{color:var(--ink-faint);font-size:20px;line-height:1;padding:0 4px}
  .teambadge{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:999px;border:1px solid var(--line)}
  .t0{color:#ffb14a;background:rgba(255,177,74,.12)}
  .t1{color:#6fd3ff;background:rgba(111,211,255,.12)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:10px 14px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);font-weight:700;font-size:15px}
  .chip.done{background:color-mix(in srgb,var(--good) 18%,var(--panel));border-color:color-mix(in srgb,var(--good) 40%,transparent)}
  .chip.pick{background:var(--accent);color:var(--accent-ink);border-color:transparent}

  /* game top bar */
  .gtop{display:flex;align-items:center;gap:8px}
  .mchip{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:15px;color:var(--accent);letter-spacing:-.01em}
  .gtop .info{flex:1;color:var(--ink-dim);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-weight:900;color:var(--ink-dim);font-size:16px;flex:none}

  /* prompt card */
  .prompt{border-radius:24px;padding:22px 20px;background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden}
  .prompt::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--accent)}
  .prompt .t{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(26px,8vw,38px);line-height:.98;letter-spacing:-.025em;text-wrap:balance}
  .prompt .q{font-size:clamp(21px,6vw,27px);font-weight:800;line-height:1.2;text-wrap:balance}
  .scale{display:flex;justify-content:space-between;gap:12px;margin-top:14px;font-size:13.5px;font-weight:700}
  .scale span{display:flex;align-items:center;gap:6px}
  .scale b{font-family:var(--display);font-size:18px;color:var(--accent)}
  .scale span:last-child{text-align:right}

  .hint{margin:0;color:var(--ink-dim);font-size:15px;line-height:1.45}
  .hint b{color:var(--ink)}
  .scores{display:flex;gap:8px}
  .sc-pill{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;font-weight:800;font-size:13px;border:1.5px solid transparent}
  .sc-pill .tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sc-pill b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;color:var(--ink)}
  .sc-pill.act{border-color:currentColor}
  .wait{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--ink-dim);font-weight:700;font-size:15px;padding:14px;text-align:center}
  .wait::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1.1s ease-in-out infinite;flex:none}
  @keyframes pulse{50%{opacity:.25;transform:scale(.7)}}

  /* hold to peek */
  /* tap to reveal a secret */
  .peek{position:relative;border-radius:24px;min-height:180px;width:100%;background:color-mix(in srgb,var(--accent) 14%,var(--panel));
    border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;overflow:hidden;
    box-shadow:0 12px 30px -16px color-mix(in srgb,var(--accent) 80%,transparent)}
  .peek:active{transform:scale(.99)}
  .peek .cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--accent)}
  .peek .cover svg{width:44px;height:44px}
  .peek .cover b{font-family:var(--display);text-transform:uppercase;font-size:20px;letter-spacing:.01em}
  .peek .secret{display:none;flex-direction:column;align-items:center;gap:2px}
  .peek .secret .num{font-family:var(--display);font-weight:900;font-size:120px;line-height:1;color:var(--accent)}
  .peek .secret small{color:var(--ink-dim);font-size:13px;font-weight:700}
  .peek.on .cover{display:none}
  .peek.on .secret{display:flex}
  .peek.on{background:var(--panel)}

  /* captain + theme scale */
  .capbar{display:flex;align-items:center;gap:12px}
  .capbar .crown{font-size:34px;line-height:1}
  .capname{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(28px,9vw,40px);line-height:.95;letter-spacing:-.02em;color:var(--accent);word-break:break-word}
  .scale2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
  .scale2 div{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--panel-2);font-weight:800;font-size:15px;line-height:1.15}
  .scale2 div:last-child{justify-content:flex-end;text-align:right}
  .scale2 b{font-family:var(--display);font-size:30px;color:var(--accent);line-height:1}

  /* drag to reorder */
  .sortable .slot{touch-action:pan-y;will-change:transform}
  .sortable .slot.lift{position:relative;z-index:2;box-shadow:0 14px 30px -10px rgba(0,0,0,.7);border-color:var(--accent);transition:none!important}
  .sortable .slot.shift{transition:transform .15s ease}
  .grip{margin-left:auto;display:flex;align-items:center;justify-content:center;width:44px;height:40px;margin-right:-6px;border-radius:10px;color:var(--ink-dim);touch-action:none;cursor:grab}
  .grip:active{cursor:grabbing;color:var(--accent)}
  .gripglyph{font-weight:900;color:var(--accent)}
  .handoff{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:10px 0}
  .handoff .to{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(40px,13vw,64px);line-height:.9;letter-spacing:-.03em;color:var(--accent);word-break:break-word}
  .handoff .lbl{color:var(--ink-dim);font-size:15px}
  .handoff .warn{font-size:14px;color:var(--ink-faint);max-width:30ch;line-height:1.4}

  /* ordering / line */
  .order{display:flex;flex-direction:column;gap:6px}
  .slot{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:16px}
  button.slot{width:100%;text-align:left}
  .slot .n{font-family:var(--display);width:30px;text-align:center;color:var(--ink-faint);font-size:15px;flex:none}
  .slot .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .slot .val{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
  .slot.ok{border-color:color-mix(in srgb,var(--good) 60%,transparent);background:color-mix(in srgb,var(--good) 12%,var(--panel))}
  .slot.bad{border-color:color-mix(in srgb,var(--miss) 60%,transparent);background:color-mix(in srgb,var(--miss) 12%,var(--panel))}
  .slot.hid .val{color:var(--ink-faint)}
  .slot.me{outline:2px solid var(--accent);outline-offset:-2px}
  .end{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:800;text-align:center;padding:2px}
  .gap{border:2px dashed color-mix(in srgb,var(--accent) 60%,transparent);color:var(--accent);border-radius:14px;padding:9px;font-weight:800;font-size:14px;
    background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .gap:active{background:color-mix(in srgb,var(--accent) 20%,transparent)}

  /* hearts / score */
  .banner{border-radius:20px;padding:16px;text-align:center;font-weight:800;font-size:17px}
  .banner.good{background:color-mix(in srgb,var(--good) 16%,var(--panel));color:var(--good)}
  .banner.bad{background:color-mix(in srgb,var(--miss) 14%,var(--panel));color:var(--miss)}
  .banner.neutral{background:var(--panel);color:var(--ink)}
  .banner .big{display:block;font-family:var(--display);font-size:38px;line-height:1;margin-bottom:4px;text-transform:uppercase;letter-spacing:-.02em}


  /* dial */
  .dialwrap{position:relative;user-select:none;-webkit-user-select:none}
  .dial{width:100%;height:auto;display:block;touch-action:none}
  .dial.drag{cursor:grab}
  .spec{display:flex;justify-content:space-between;gap:10px;margin-top:-4px}
  .spec div{flex:1;font-family:var(--display);text-transform:uppercase;font-size:clamp(16px,5vw,22px);line-height:1;letter-spacing:-.01em;padding:10px 12px;border-radius:14px}
  .spec .l{background:rgba(111,211,255,.14);color:#8fdcff}
  .spec .r{background:rgba(255,120,90,.14);color:#ff9b82;text-align:right}

  /* sheet */
  .sheet{position:fixed;inset:0;background:rgba(5,6,12,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease both}
  .sheet .in{width:100%;max-width:540px;max-height:88dvh;overflow:auto;background:var(--ground);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:20px 18px max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:up .25s ease both}
  @keyframes fade{from{opacity:0}}
  @keyframes up{from{transform:translateY(30px)}}
  .toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:40;animation:rise .2s ease both;max-width:90vw;text-align:center}
  .netbar{background:color-mix(in srgb,var(--miss) 18%,var(--panel));color:var(--ink);border:1px solid color-mix(in srgb,var(--miss) 45%,transparent);border-radius:14px;padding:10px 12px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px}

  .confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
  .room-code{font-family:var(--display);font-size:clamp(54px,18vw,80px);letter-spacing:.14em;line-height:1;color:var(--accent);text-align:center}
  hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
</style>
</head>
<body>
<div class="flood"></div>
<main class="app" id="app"></main>
<div id="layer"></div>
<script>
/* ---------- DECKS ----------
   RANK:   "Theme|what 1 means|what 10 means"
   LINEUP: "Question|unit"
   DIAL:   "Left|Right"                                  */

DECK.rank = `Superpowers|lamest|coolest

Reality show ideas|unwatchable|most bingeable

/* ---------- RANK ---------- */
function rankView() {
  const g = S.g, [theme, lo, hi] = cardOf(g), cap = capId(g), others = crew(g);
  const themeCard = promptCard(`<div class="eyebrow">Theme</div><div class="t" style="margin-top:6px">${esc(theme)}</div>
    <div class="scale2"><div><b>1</b><span>${esc(lo)}</span></div><div><span>${esc(hi)}</span><b>10</b></div></div>`);
  const isCap = ROLE !== "pass" && ME === cap;
  const capBar = `<div class="capbar"><span class="crown" aria-hidden="true">👑</span><div class="grow">
    <div class="eyebrow">Captain${g.two ? " · " + esc(teamName(g.at)) : ""}</div><div class="capname">${isCap ? "You" : esc(nm(cap))}</div></div></div>`;
  let h = g.two ? topbar(`Round ${roundNo(g)}/${g.rounds}`) + scoreboard(g)
                : topbar(`Round ${g.round}/${g.rounds} · ❤️ ${g.hearts}`);
  if (!inGame()) return h + themeCard + spectator();

  if (g.phase === "theme") {
    h += capBar + themeCard;
    if (mine(cap)) h += `<div class="bottom"><button class="ghost" data-a="rkNew">↻ Different theme</button>
      <button class="cta" data-a="rkDeal">Deal secret numbers</button></div>`;
    else h += wait(`${esc(nm(cap))} is picking a theme`);
    return h;
  }
  if (g.phase === "deal") {
    const seenN = others.filter(p => g.seen[p]).length;
    if (ROLE === "pass") {
      const next = others.find(p => !g.seen[p]);
      return h + handoff(nm(next), "Pass the phone to", `Only <b>${esc(nm(next))}</b> looks. Everyone else, look away.`)
        + peekBox(g.nums[next], "Tap to see your number")
        + `<div class="bottom"><button class="cta" data-a="rkSeen" data-v="${next}">Got it, pass it on</button>
           <div class="faint small center">${seenN}/${others.length} players have their number</div></div>`;
    }
    h += capBar + themeCard;
    if (ME === cap) return h + wait(`Players are checking their numbers (${seenN}/${others.length})`) + hostHelp(others.filter(p => !g.seen[p]), "rkSeen");
    if (!others.includes(ME)) return h + wait(`${esc(teamName(g.at))} is checking their numbers (${seenN}/${others.length})`);
    if (!g.seen[ME]) return h + peekBox(g.nums[ME], "Tap to see your number") + `<div class="bottom"><button class="cta" data-a="rkSeen" data-v="${ME}">Got it</button></div>`;
    return h + wait(`Waiting for others (${seenN}/${others.length})`) + hostHelp(others.filter(p => !g.seen[p]), "rkSeen") + peekBox(g.nums[ME], "Tap to see your number again");
  }
  if (g.phase === "order") {
    const canSort = mine(cap);
    h += capBar + themeCard;
    h += roleLine("", canSort
      ? `Everyone acts out the theme to match their number. Drag <span class="gripglyph">≡</span> to rank them, lowest at the top.`
      : `Act out the theme to match your number. ${esc(nm(cap))} is ranking everyone.`);
    h += sortList(g.order, "rkMove", canSort, `1 · ${esc(lo)}`, `10 · ${esc(hi)}`);
    if (canSort) h += `<div class="bottom"><button class="cta" data-a="rkLock">Lock in the order</button></div>`;
    else if (others.includes(ME)) h += peekBox(g.nums[ME], "Tap to see your number");
    return h;
  }
  if (g.phase === "reveal") {
    h += promptCard(`<div class="eyebrow">Theme</div><div class="q" style="margin-top:4px">${esc(theme)}</div>`);
    // numbers flip one at a time; right/wrong marks appear once the whole order is known
    h += `<div class="order">${g.order.map((p, i) => {
      const shown = i < g.rev, judged = g.applied;
      return `<div class="slot ${judged ? (g.flags[i] ? "ok" : "bad") : shown ? "" : "hid"}"><span class="n">${i + 1}</span><span class="nm">${esc(nm(p))}</span>
        <span class="val">${shown ? g.nums[p] + (judged ? (g.flags[i] ? " ✓" : " ✗") : "") : "?"}</span></div>`;
    }).join("")}</div>`;
    if (!g.applied) h += `<div class="bottom"><button class="cta" data-a="rkReveal">Reveal next</button><button class="ghost" data-a="rkReveal" data-v="all">Reveal all</button></div>`;
    else {
      const miss = g.delta < 0 ? -g.delta : 0, who = g.two ? esc(teamName(g.at)) + " · " : "";
      h += miss ? `<div class="banner bad"><span class="big">−${miss} ❤️</span>${who}${miss} player${miss === 1 ? "" : "s"} had to move</div>`
                : `<div class="banner good"><span class="big">Perfect!</span>${who}+1 heart</div>`;
      h += `<div class="bottom"><button class="cta" data-a="rkNext">${rankOver(g) ? "See how you did" : "Next round"}</button></div>`;
    }
    return h;
  }
  return h;
}
// drag-to-reorder list; the ≡ grip moves a row (arrow keys work too)
function sortList(ids, action, editable, top, bottom) {
  return `<div class="order sortable" data-act="${action}"><div class="end">▲ ${top}</div>${ids.map((p, i) => {
    const own = ROLE !== "pass" && p === ME && S.g.type === "lineup" && S.g.ans[p] != null;
    return `<div class="slot ${own ? "me" : ""}" data-i="${i}"><span class="n">${i + 1}</span><span class="nm">${esc(nm(p))}</span>
      ${own ? `<span class="val">${esc(S.g.ans[p])}</span>` : ""}
      ${editable ? `<span class="grip" tabindex="0" role="button" aria-label="Move ${esc(nm(p))}. Use arrow keys.">${GRIP}</span>` : ""}</div>`;
  }).join("")}<div class="end">▼ ${bottom}</div></div>`;
}
const GRIP = `<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>`;
function hostHelp(pids, type) {
  if (ROLE !== "host") return "";
  const off = pids.filter(p => !online(p));
  if (!off.length) return "";
  return `<div class="row wrap"><span class="faint small grow">Offline players:</span>${off.map(p => `<button class="ghost" data-a="${type}" data-v="${p}">Skip ${esc(nm(p))}</button>`).join("")}</div>`;
}

/* ---------- LINE UP ---------- */
function lineupView() {
  const g = S.g, [q, unit] = cardOf(g);
  const qCard = promptCard(`<div class="q">${esc(q)}</div>`);
  let h = g.two ? topbar(`Round ${roundNo(g)}/${g.rounds}`) + scoreboard(g) : topbar(`Round ${g.round}/${g.rounds} · ${g.score} pts`);
  const P = playing(g);
  if (!inGame()) return h + qCard + spectator();
  const answered = P.filter(p => g.ans[p] != null);
  const status = `<div class="chips">${P.map(p => `<span class="chip ${g.ans[p] != null ? "done" : ""}">${g.ans[p] != null ? "✓ " : ""}${esc(nm(p))}</span>`).join("")}</div>`;
  const input = pid => `<div class="field"><label for="ans-${pid}">Your answer (${esc(unit)})</label>
    <input class="inp big" id="ans-${pid}" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(U.drafts["ans-" + pid] || "")}"></div>`;

  if (g.phase === "answer") {
    if (ROLE === "pass") {
      const next = P.find(p => g.ans[p] == null);
      return h + handoff(nm(next), "Pass the phone to", "Answer honestly. Nobody else should see this screen.") + qCard + input(next)
        + `<div class="bottom"><button class="cta" data-a="luAns" data-v="${next}">Lock in secretly</button>
           <div class="faint small center">${answered.length}/${P.length} answered</div></div>`;
    }
    h += qCard;
    if (!P.includes(ME)) return h + wait(`${teamName(g.at)} is answering (${answered.length}/${P.length})`) + status;
    if (g.ans[ME] == null) return h + input(ME) + `<div class="bottom"><button class="cta" data-a="luAns" data-v="${ME}">Lock in secretly</button></div>` + status;
    return h + wait(`Locked in (${esc(g.ans[ME])}). Waiting for everyone (${answered.length}/${P.length})`) + status
      + (ROLE === "host" && P.some(p => g.ans[p] == null && !online(p)) ? `<div class="faint small">Someone's offline? Remove them from the game in ⋯.</div>` : "");
  }
  if (g.phase === "place") {
    const cur = g.turn[g.ti];
    const canPlace = mine(cur);
    const showOwn = p => ROLE !== "pass" && p === ME;
    h += promptCard(`<div class="q" style="font-size:19px">${esc(q)}</div>`);
    h += roleLine("", `<b>${esc(nm(cur))}</b>${canPlace ? ", tap where you fit." : " is choosing where they fit."}`);
    let rows = `<div class="end">▲ Lowest</div>`;
    g.line.forEach((p, i) => {
      if (canPlace) rows += `<button class="gap" data-a="luPlace" data-v="${i}">＋ Here</button>`;
      rows += `<div class="slot ${showOwn(p) ? "me" : ""}"><span class="n">${i + 1}</span><span class="nm">${esc(nm(p))}</span><span class="val">${showOwn(p) ? esc(g.ans[p]) : ""}</span></div>`;
    });
    if (canPlace) rows += `<button class="gap" data-a="luPlace" data-v="${g.line.length}">＋ Here</button>`;
    rows += `<div class="end">▼ Highest</div>`;
    h += `<div class="order">${rows}</div>`;
    const later = g.turn.slice(g.ti + 1);
    if (later.length) h += `<div class="faint small">Still to place: ${later.map(nm).map(esc).join(", ")}</div>`;
    if (ROLE !== "pass" && g.ans[ME] != null) h += `<div class="faint small center">Your answer: <b>${esc(g.ans[ME])}</b></div>`;
    return h;
  }
  if (g.phase === "adjust") {
    const canSort = ROLE === "pass" || playing(g).includes(ME) || ROLE === "host";
    h += promptCard(`<div class="q" style="font-size:19px">${esc(q)}</div>`);
    h += roleLine("", canSort ? `Everyone's in. Argue it out and drag <span class="gripglyph">≡</span> to fix the line, then reveal.` : `${esc(teamName(g.at))} is fixing their line.`);
    h += sortList(g.line, "luMove", canSort, "Lowest", "Highest");
    if (canSort) h += `<div class="bottom"><button class="cta" data-a="luShow">Reveal answers</button></div>`;
    return h;
  }
  if (g.phase === "reveal") {
    const pts = g.flags.filter(Boolean).length, n = g.line.length;
    h += promptCard(`<div class="q" style="font-size:19px">${esc(q)}</div>`);
    h += `<div class="order"><div class="end">▲ Lowest</div>${g.line.map((p, i) => `<div class="slot ${g.flags[i] ? "ok" : "bad"}"><span class="n">${i + 1}</span><span class="nm">${esc(nm(p))}</span><span class="val">${esc(g.ans[p])}${g.flags[i] ? " ✓" : " ✗"}</span></div>`).join("")}<div class="end">▼ Highest</div></div>`;
    h += `<div class="banner ${pts === n ? "good" : pts >= n / 2 ? "neutral" : "bad"}"><span class="big">${pts}/${n}</span>${pts === n ? "Perfect line!" : "in the right spot"}</div>`;
    h += `<div class="bottom"><button class="cta" data-a="luNext">${turnsDone(g) ? "See how you did" : "Next question"}</button></div>`;
    return h;
  }
  return h;
}

/* ---------- DIAL ---------- */
function dialSvg(o) {
  const R = 92, cx = 100, cy = 102;
  const pt = (p, r = R) => { const a = Math.PI * (1 - p / 100); return [cx + r * Math.cos(a), cy - r * Math.sin(a)]; };
  const f = n => n.toFixed(2);
  const wedge = (p1, p2, fill) => {
    p1 = clamp(p1, 0, 100); p2 = clamp(p2, 0, 100); if (p2 - p1 < .01) return "";
    const [x1, y1] = pt(p1), [x2, y2] = pt(p2);
    return `<path d="M${cx} ${cy} L${f(x1)} ${f(y1)} A${R} ${R} 0 0 1 ${f(x2)} ${f(y2)} Z" fill="${fill}"/>`;
  };
  let s = `<path d="M${cx - R} ${cy} A${R} ${R} 0 0 1 ${cx + R} ${cy} Z" fill="#1f2438" stroke="rgba(255,255,255,.12)"/>`;
  for (let p = 0; p <= 100; p += 10) { const [x1, y1] = pt(p, R - 1), [x2, y2] = pt(p, R - (p % 50 ? 6 : 10)); s += `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="rgba(255,255,255,.25)" stroke-width="1"/>`; }
  if (o.target != null) {
    const t = o.target;
    s += wedge(t - 20, t - 12, "#f5b301") + wedge(t - 12, t - 4, "#ff7a45") + wedge(t - 4, t + 4, "#ff3d8b") + wedge(t + 4, t + 12, "#ff7a45") + wedge(t + 12, t + 20, "#f5b301");
    [[-16, 2], [-8, 3], [0, 4], [8, 3], [16, 2]].forEach(([d, n]) => {
      const p = t + d; if (p < 1 || p > 99) return; const [x, y] = pt(p, R - 16);
      s += `<text x="${f(x)}" y="${f(y)}" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="900" fill="#0d0e16" font-family="Arial Black, Arial">${n}</text>`;
    });
  }
  if (o.needle != null) {
    s += `<g id="needle" style="transform-origin:${cx}px ${cy}px;transform:rotate(${o.needle * 1.8 - 90}deg);transition:${o.anim ? "transform .6s cubic-bezier(.2,.8,.2,1)" : "none"}">
      <line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy - R + 4}" stroke="#f4f5fb" stroke-width="4" stroke-linecap="round"/></g>`;
  }
  s += `<circle cx="${cx}" cy="${cy}" r="9" fill="#f4f5fb"/>`;
  return `<div class="dialwrap"><svg class="dial ${o.drag ? "drag" : ""}" ${o.drag ? `id="dialsvg"` : ""} viewBox="0 0 200 106" role="img" aria-label="Dial">${s}</svg></div>`;
}
const specRow = (l, r) => `<div class="spec"><div class="l">← ${esc(l)}</div><div class="r">${esc(r)} →</div></div>`;
const teamName = i => ((S && S.teamNames) || U.teamNames)[i] || (i ? "Team B" : "Team A");
// slim team score strip; the team whose turn it is gets an outline
function scoreboard(g) {
  if (!g.two) return "";
  return `<div class="scores">${g.teams.map((t, i) => `<span class="sc-pill t${i} ${i === g.at && S.stage === "play" ? "act" : ""}"><span class="tn">${esc(teamName(i))}</span><b>${g.type === "rank" ? "❤️ " + t.hearts : t.score}</b></span>`).join("")}</div>`;
}
function dialView() {
  const g = S.g, [l, r] = cardOf(g), psy = psyId(g);
  let h = topbar(g.two ? `First to ${g.goal}` : `Round ${g.round}/${g.rounds} · ${g.teams[0].score} pts`) + scoreboard(g);
  if (!inGame()) return h + dialSvg({ needle: g.dial }) + specRow(l, r) + spectator();
  const teamTxt = g.two ? ` for <b>${esc(teamName(g.at))}</b>` : "";

  if (g.phase === "peek") {
    if (ROLE === "pass" && !U.psyShow) {
      return h + handoff(nm(psy), `Psychic${g.two ? " for " + esc(teamName(g.at)) : ""}`, "Everyone else, look away! Only the Psychic sees the target.")
        + specRow(l, r) + `<div class="bottom"><button class="cta" data-a="psyShow">I'm ${esc(nm(psy))}. Show me.</button></div>`;
    }
    if (mine(psy)) {
      return h + dialSvg({ target: g.target, needle: null }) + specRow(l, r)
        + roleLine("", `Think of a clue that belongs on the <b>4</b>.`)
        + `<div class="bottom"><button class="ghost" data-a="dlNew">↻ Different spectrum</button>
           <button class="cta" data-a="dlClue">${ROLE === "pass" ? "Hide it & say your clue" : "Ready to say my clue"}</button></div>`;
    }
    return h + dialSvg({ needle: 50 }) + specRow(l, r) + wait(`<b>${esc(nm(psy))}</b>&nbsp;is the Psychic${teamTxt}`);
  }
  const clue = roleLine("", `<b>${esc(nm(psy))}</b> says the clue out loud.`);
  if (g.phase === "guess") {
    const canMove = ROLE === "pass" || guessers(g).includes(ME) || (ROLE === "host" && guessers(g).every(p => !online(p)));
    h += clue + dialSvg({ needle: g.dial, drag: canMove }) + specRow(l, r);
    if (canMove) {
      h += `<div class="bottom"><div class="row"><button class="ghost" data-a="nudge" data-v="-2" aria-label="Nudge left">◀</button>
        <button class="cta grow" data-a="dlLock">Lock in</button><button class="ghost" data-a="nudge" data-v="2" aria-label="Nudge right">▶</button></div></div>`;
    } else if (ME === psy) h += wait("Your team is turning the dial. No hints!");
    else h += wait(`${esc(teamName(g.at))} is turning the dial`);
    return h;
  }
  if (g.phase === "counter") {
    const other = 1 - g.at;
    const can = ROLE === "pass" || g.teams[other].ids.includes(ME) || (ROLE === "host" && g.teams[other].ids.every(p => !online(p)));
    h += clue + dialSvg({ needle: g.dial }) + specRow(l, r);
    h += roleLine("", `<b>${esc(teamName(other))}</b>: is the target left or right of the dial? +1 if you're right.`);
    if (can) h += `<div class="bottom"><div class="row"><button class="cta alt grow" data-a="dlCounter" data-v="left">◀ Left</button><button class="cta alt grow" data-a="dlCounter" data-v="right">Right ▶</button></div></div>`;
    else h += wait(`${esc(teamName(other))} is deciding`);
    return h;
  }
  if (g.phase === "reveal") {
    h += clue + dialSvg({ target: g.target, needle: g.dial }) + specRow(l, r);
    h += `<div class="banner ${g.pts >= 3 ? "good" : g.pts ? "neutral" : "bad"}"><span class="big">${g.pts ? "+" + g.pts : "0"}</span>${g.two ? esc(teamName(g.at)) : ""}</div>`;
    if (g.two && g.counter) h += `<div class="faint center">${esc(teamName(1 - g.at))} guessed ${g.counter}: ${g.bonus ? "+1" : "no bonus"}</div>`;
    const end = g.two ? g.teams.some(t => t.score >= g.goal) : g.round >= g.rounds;
    h += `<div class="bottom"><button class="cta" data-a="dlNext">${end ? "See results" : "Next round"}</button></div>`;
    return h;
  }
  return h;
}

/* ---------- game over ---------- */
function overView() {
  const g = S.g, m = MODES[S.mode];
  let head = "", sub = "", good = true;
  if (g.two) {
    const [a, b] = g.teams.map(t => g.type === "rank" ? t.hearts : t.score);
    head = a === b ? "It's a tie!" : `${teamName(a > b ? 0 : 1)} wins!`;
    sub = `${a} – ${b}`;
  } else if (g.type === "rank") {
    good = g.hearts > 0;
    head = good ? "You survived!" : "Out of hearts";
    sub = good ? `${g.hearts} heart${g.hearts === 1 ? "" : "s"} left after ${g.round} rounds` : `Made it to round ${g.round} of ${g.rounds}`;
  } else if (g.type === "lineup") {
    const pct = g.possible ? Math.round(100 * g.score / g.possible) : 0;
    head = pct >= 90 ? "Mind readers" : pct >= 70 ? "Serious nunchi" : pct >= 50 ? "Getting there" : "Total strangers";
    sub = `${g.score} of ${g.possible} placed right (${pct}%)`;
    good = pct >= 50;
  } else {
    const avg = g.teams[0].score / Math.max(1, g.round);
    head = avg >= 3 ? "On the same wavelength" : avg >= 2 ? "Pretty in sync" : "Static on the line";
    sub = `${g.teams[0].score} points in ${g.round} rounds`;
    good = avg >= 2;
  }
  const host = isHostDevice();
  return `<section class="screen" style="justify-content:center">
    <div class="center"><span class="mchip">${m.name}</span></div>
    <div class="banner ${good ? "good" : "bad"}"><span class="big">${esc(head)}</span>${esc(sub)}</div>
    ${g.two ? scoreboard(g) : ""}
    <div class="bottom">
      ${host ? `<button class="cta" data-a="again">Play ${m.name} again</button>
                <button class="cta alt" data-a="${ROLE === "pass" ? "changeGame" : "lobby"}">${ROLE === "pass" ? "Pick another game" : "Back to the lobby"}</button>`
             : wait(`Waiting for ${esc(nm(S.hostId))} to pick what's next`)}
      ${ROLE === "guest" ? `<button class="link" data-a="leave">Leave room</button>` : ""}
    </div>
  </section>`;
}

/* ---------- sheets ---------- */
function sheetView() {
  const s = U.sheet; if (!s) return "";
  let inner = "";
  if (s.k === "rules") {
    const k = s.mode;
    inner = `<div class="row"><div class="display grow" style="font-size:34px;color:${MODES[k].color}">${MODES[k].name}</div></div>
      ${rulesBlock(k)}<button class="cta" data-a="close">Got it</button>`;
  } else if (s.k === "menu") {
    const off = ROLE === "host" && S && S.g && S.stage === "play" ? S.g.roster.filter(p => p !== ME) : [];
    inner = `<div class="eyebrow">Menu</div>
      <button class="cta alt" data-a="rules">How to play ${MODES[S.mode].name}</button>
      ${S.play === "room" ? `<button class="cta alt" data-a="share">Share invite link (${esc(S.code)})</button>` : ""}
      ${off.length ? `<div class="eyebrow">Remove a player from this game</div><div class="chips">${off.map(p => `<button class="chip" data-a="drop" data-v="${p}">${online(p) ? "" : "⚪ "}${esc(nm(p))}</button>`).join("")}</div>` : ""}
      ${ROLE === "pass" ? `<button class="cta alt" data-a="endPass">End game</button>` : ""}
      ${ROLE === "host" ? `<button class="cta alt" data-a="lobby">End game, back to lobby</button><button class="cta alt" data-a="closeRoom">Close the room</button>` : ""}
      ${ROLE === "guest" ? `<button class="cta alt" data-a="leave">Leave room</button>` : ""}
      <button class="link" data-a="close">Close</button>`;
  } else if (s.k === "modes") {
    inner = `<div class="eyebrow">Pick a game</div><div class="modes">${Object.keys(MODES).map(k => modeCard(k).replace('data-a="pick"', 'data-a="setMode"')).join("")}</div>
      <button class="link" data-a="close">Cancel</button>`;
  } else if (s.k === "ask") {
    inner = `<div class="q" style="font-size:22px;font-weight:800">${esc(s.text)}</div>
      <button class="cta" data-a="${s.then}" ${s.v ? `data-v="${esc(s.v)}"` : ""}>${esc(s.yes)}</button>
      <button class="cta alt" data-a="close">Cancel</button>`;
  }
  return `<div class="sheet" data-a="scrim"><div class="in" role="dialog" aria-modal="true">${inner}</div></div>`;
}

/* ================= render ================= */
function view() {
  if (!S) return ({ home: homeView, mode: modeView, setup: setupView, host: hostView, join: joinView, connecting: connectingView }[U.screen] || homeView)();
  if (S.stage === "lobby") return lobbyView();
  if (S.stage === "over") return overView();
  const v = { rank: rankView, lineup: lineupView, dial: dialView }[S.mode]();
  return `<section class="screen">${v}</section>`;
}
let lastKey = "";
function render() {
  if (U.dragging) { U.pendingRender = true; return; }
  const mode = (S && S.mode) || (U.screen !== "home" && U.screen !== "join" ? U.pick : "") || "";
  document.body.dataset.mode = mode;
  const ae = document.activeElement;
  const keep = ae && ae.id && ae.tagName === "INPUT" ? { id: ae.id, s: ae.selectionStart, e: ae.selectionEnd } : null;
  // only animate the screen when the "page" actually changes
  const key = S ? [S.stage, S.g && S.g.phase, S.g && S.g.round, S.g && S.g.type === "rank" && S.g.phase === "deal" ? Object.keys(S.g.seen).length : "", S.g && S.g.type === "lineup" && S.g.phase === "answer" ? Object.keys(S.g.ans).length : ""].join("|") : U.screen + U.pick;
  app.innerHTML = view();
  if (key === lastKey) app.querySelectorAll(".screen").forEach(el => el.style.animation = "none");
  lastKey = key;
  if (keep) { const el = document.getElementById(keep.id); if (el) { el.focus({ preventScroll: true }); try { el.setSelectionRange(keep.s, keep.e); } catch (e) {} } }
  layer.innerHTML = sheetView();
  wirePeeks(); wireDial(); wireSort();
  if (S && S.stage === "over" && !U.cele) { U.cele = true; const g = S.g; if ((g.type === "rank" && g.hearts > 0) || g.type !== "rank") confetti(); }
  if (!S || S.stage !== "over") U.cele = false;
}
function wirePeeks() {
  document.querySelectorAll(".peek").forEach(el => el.addEventListener("click", () => {
    const on = el.classList.toggle("on"); el.setAttribute("aria-pressed", String(on));
  }));
}
// drag the ≡ grip to reorder a .sortable list; arrow keys move one step
function wireSort() {
  document.querySelectorAll(".sortable").forEach(list => {
    const type = list.dataset.act;
    const rows = () => [...list.querySelectorAll(".slot")];
    list.querySelectorAll(".grip").forEach(grip => {
      const row = grip.closest(".slot"), from = Number(row.dataset.i);
      grip.addEventListener("keydown", e => {
        const d = e.key === "ArrowUp" ? -1 : e.key === "ArrowDown" ? 1 : 0;
        if (!d) return;
        e.preventDefault();
        const to = clamp(from + d, 0, rows().length - 1);
        if (to !== from) { U.refocus = { type, i: to }; act({ type, from, to }); }
      });
      grip.addEventListener("pointerdown", e => {
        e.preventDefault();
        const all = rows(), step = row.offsetHeight + 6;
        let to = from;
        U.dragging = true; row.classList.add("lift");
        all.forEach(r => r !== row && r.classList.add("shift"));
        try { grip.setPointerCapture(e.pointerId); } catch (x) {}
        const y0 = e.clientY;
        const move = ev => {
          const dy = ev.clientY - y0;
          row.style.transform = `translateY(${dy}px)`;
          to = clamp(from + Math.round(dy / step), 0, all.length - 1);
          all.forEach((r, k) => {
            if (r === row) return;
            const shift = from < to && k > from && k <= to ? -step : from > to && k < from && k >= to ? step : 0;
            r.style.transform = shift ? `translateY(${shift}px)` : "";
          });
        };
        const up = () => {
          grip.removeEventListener("pointermove", move);
          grip.removeEventListener("pointerup", up); grip.removeEventListener("pointercancel", up);
          U.dragging = false;
          if (to !== from) {
            // guests see the move right away; the host's copy follows a moment later
            if (ROLE === "guest") moveItem(type === "rkMove" ? S.g.order : S.g.line, from, to);
            act({ type, from, to });
          }
          if (U.pendingRender || to !== from) { U.pendingRender = false; render(); }
          else { row.classList.remove("lift"); all.forEach(r => { r.style.transform = ""; r.classList.remove("shift"); }); }
        };
        grip.addEventListener("pointermove", move);
        grip.addEventListener("pointerup", up); grip.addEventListener("pointercancel", up);
      });
    });
  });
  if (U.refocus) {
    const el = document.querySelector(`.sortable[data-act="${U.refocus.type}"] .slot[data-i="${U.refocus.i}"] .grip`);
    if (el) el.focus(); U.refocus = null;
  }
}
let lastSend = 0, sendTimer = null;
function sendDial(p) {
  clearTimeout(sendTimer);
  const go = () => { lastSend = Date.now(); act({ type: "dlMove", v: Math.round(p * 10) / 10 }); };
  if (Date.now() - lastSend > 80) go(); else sendTimer = setTimeout(go, 80);
}
function wireDial() {
  const svg = $("#dialsvg"); if (!svg) return;
  const needle = svg.querySelector("#needle");
  const posFrom = e => {
    const r = svg.getBoundingClientRect(), k = r.width / 200;
    const x = (e.clientX - r.left) / k, y = (e.clientY - r.top) / k;
    let a = Math.atan2(102 - y, x - 100);
    if (a < 0) a = x < 100 ? Math.PI : 0;
    return clamp(100 * (1 - a / Math.PI), 0, 100);
  };
  const move = e => {
    const p = posFrom(e); U.localDial = p;
    needle.style.transform = `rotate(${p * 1.8 - 90}deg)`;
    sendDial(p);
  };
  svg.addEventListener("pointerdown", e => { U.dragging = true; try { svg.setPointerCapture(e.pointerId); } catch (x) {} move(e); });
  svg.addEventListener("pointermove", e => { if (U.dragging) move(e); });
  const end = () => {
    if (!U.dragging) return;
    U.dragging = false; clearTimeout(sendTimer);
    act({ type: "dlMove", v: Math.round(U.localDial * 10) / 10 });
    if (U.pendingRender) { U.pendingRender = false; render(); }
  };
  svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
}

/* ================= toast + confetti ================= */
let toastT;
function toast(msg) {
  const old = document.querySelector(".toast"); if (old) old.remove();
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600);
}
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.createElement("canvas"); c.className = "confetti"; document.body.appendChild(c);
  const x = c.getContext("2d"), W = c.width = innerWidth, H = c.height = innerHeight;
  const cols = ["#ff3d8b", "#f5b301", "#2fb7ff", "#25c281", "#9b6bff"];
  const P = Array.from({ length: 140 }, () => ({ x: W / 2 + (Math.random() - .5) * 80, y: H * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, s: 5 + Math.random() * 6, r: Math.random() * 6, c: cols[rnd(5)] }));
  let f = 0;
  (function tick() {
    x.clearRect(0, 0, W, H);
    P.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += .15; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); });
    if (++f < 150) requestAnimationFrame(tick); else c.remove();
  })();
}

/* ================= input handling ================= */
function inviteLink() {
  const u = new URL(location.href); u.search = ""; u.hash = "";
  u.searchParams.set("room", S.code);
  ["net", "peerhost"].forEach(k => { if (params.get(k)) u.searchParams.set(k, params.get(k)); });
  return u.toString();
}
async function share() {
  const url = inviteLink();
  try {
    if (navigator.share) { await navigator.share({ title: "Nunchi", text: `Join my Nunchi room: ${S.code}`, url }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(url); toast("Invite link copied"); }
  catch (e) { prompt("Copy this link:", url); }
}
function savePP() {}
function addName() {
  const n = cleanName(U.drafts.newname);
  if (!n) return;
  if (U.pp.some(p => p.name.toLowerCase() === n.toLowerCase())) { toast(n + " is already playing"); return; }
  const t0 = U.pp.filter(p => !p.team).length;
  U.pp.push({ id: uid(), name: n, team: t0 > U.pp.length - t0 ? 1 : 0 });
  U.drafts.newname = ""; savePP(); render();
  const el = $("#newname"); if (el) el.focus();
}
async function createRoom() {
  const name = cleanName(U.drafts.hostname ?? U.name);
  if (!name) { U.err = "Enter your name first."; render(); return; }
  U.name = name; store.set("nunchi-name", name);
  U.err = ""; U.net = "Opening a room…"; U.screen = "connecting"; render();
  const tok = U.conn = (U.conn || 0) + 1;
  try {
    const code = await hostRoom(newCode());
    if (tok !== U.conn) { try { Net.peer.destroy(); } catch (e) {} Net.peer = null; return; }
    ROLE = "host"; ME = uid();
    S = { v: 0, play: "room", code, mode: U.pick, hostId: ME, stage: "lobby", sets: JSON.parse(JSON.stringify(U.sets)), teamNames: U.teamNames.slice(),
          players: [{ id: ME, name, team: 0, on: true }], g: null };
    commit();
  } catch (e) { if (tok !== U.conn) return; U.screen = "host"; U.err = e.message; render(); }
}
async function doJoin(code, name) {
  U.err = ""; U.net = `Joining room ${code}…`; U.screen = "connecting"; render();
  const tok = U.conn = (U.conn || 0) + 1;
  try {
    await joinRoom(code, name);
    if (tok !== U.conn) { goHome(); return; }
    ROLE = "guest"; U.screen = "home";
    store.set("nunchi-save", { role: "guest", code, mode: S && S.mode, t: Date.now() });
    render();
  } catch (e) { if (tok !== U.conn) return; U.screen = "join"; U.err = e.message; render(); }
}
async function resume() {
  const sv = store.get("nunchi-save", null); if (!sv) return;
  if (sv.role === "pass") { ROLE = "pass"; ME = null; S = sv.S; render(); return; }
  if (sv.role === "guest") { U.joinCode = sv.code; return doJoin(sv.code, U.name || "Player"); }
  U.net = `Reopening room ${sv.S.code}…`; U.screen = "connecting"; render();
  try {
    await hostRoom(sv.S.code, true);
    ROLE = "host"; ME = sv.me; S = sv.S;
    S.players.forEach(p => p.on = p.id === ME);
    commit();
  } catch (e) { U.screen = "home"; render(); toast(e.message); }
}

document.addEventListener("input", e => {
  const t = e.target; if (!t.id) return;
  if (t.id === "joincode") t.value = t.value.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);
  U.drafts[t.id] = t.value;
});
document.addEventListener("change", e => { if (/^tn-[01]$/.test(e.target.id || "")) commitTeamNames(); });
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || !e.target.id) return;
  const id = e.target.id;
  if (/^tn-[01]$/.test(id)) { e.target.blur(); return; }
  if (id === "newname") addName();
  else if (id === "hostname") createRoom();
  else if (id === "joincode" || id === "joinname") handle("joinRoom");
  else if (id.startsWith("ans-")) handle("luAns", id.slice(4));
  else if (id === "clue") handle("dlClue");
});
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el || el.disabled) return;
  if (el.dataset.a === "scrim" && e.target !== el) return;
  handle(el.dataset.a, el.dataset.v, el);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && U.sheet) { U.sheet = null; render(); } });

function ask(text, yes, then, v) { U.sheet = { k: "ask", text, yes, then, v }; render(); }
function handle(a, v, el) {
  switch (a) {
    /* ---- local navigation ---- */
    case "home": U.conn = (U.conn || 0) + 1; U.screen = "home"; U.err = ""; render(); scrollTo(0, 0); return;
    case "pick": U.pick = v; U.screen = "mode"; U.err = ""; render(); scrollTo(0, 0); return;
    case "goSetup": U.screen = "setup"; render(); scrollTo(0, 0); return;
    case "goHost": U.screen = "host"; U.err = ""; render(); scrollTo(0, 0); return;
    case "goJoin": U.screen = "join"; U.err = ""; render(); return;
    case "addName": addName(); return;
    case "tnRoll": {
      const names = drawTeamNames([0, 1].map(teamName));
      delete U.drafts["tn-0"]; delete U.drafts["tn-1"];
      if (S) act({ type: "teamNames", val: names });
      else { U.teamNames = names; store.set("nunchi-teamnames", names); render(); }
      return;
    }
    case "rmName": U.pp = U.pp.filter(p => p.id !== v); savePP(); render(); return;
    case "swapTeam": { const p = U.pp.find(p => p.id === v); if (p) p.team = p.team ? 0 : 1; savePP(); render(); return; }
    case "startPass": {
      const m = MODES[U.pick]; if (U.pp.length < m.min || U.pp.length > m.max) return;
      commitTeamNames();
      ROLE = "pass"; ME = null;
      S = { v: 0, play: "pass", code: null, mode: U.pick, hostId: null, stage: "lobby", sets: JSON.parse(JSON.stringify(U.sets)), teamNames: U.teamNames.slice(),
            players: U.pp.map(p => ({ id: p.id, name: p.name, team: p.team || 0, on: true })), g: null };
      startGame(); commit(); scrollTo(0, 0); return;
    }
    case "createRoom": createRoom(); return;
    case "joinRoom": {
      const code = String(U.drafts.joincode ?? U.joinCode).toUpperCase(), name = cleanName(U.drafts.joinname ?? U.name);
      if (code.length !== 4) { U.err = "Room codes are 4 letters."; render(); return; }
      if (!name) { U.err = "Enter your name."; render(); return; }
      U.joinCode = code; U.name = name; store.set("nunchi-name", name);
      doJoin(code, name); return;
    }
    case "resume": resume(); return;
    case "reconnect": reconnect(false); return;
    case "share": share(); return;
    case "rules": U.sheet = { k: "rules", mode: (S && S.mode) || U.pick }; render(); return;
    case "menu": U.sheet = { k: "menu" }; render(); return;
    case "modePick": U.sheet = { k: "modes" }; render(); return;
    case "close": case "scrim": U.sheet = null; render(); return;
    case "psyShow": U.psyShow = true; render(); return;
    case "leave": ask("Leave this room?", "Leave", "yesLeave"); return;
    case "closeRoom": ask("Close the room for everyone?", "Close room", "yesClose"); return;
    case "endPass": ask("End this game?", "End game", "yesEnd"); return;
    case "yesLeave": case "yesClose": goHome(); return;
    case "yesEnd": { const k = S.mode; goHome(); U.pick = k; U.screen = "mode"; render(); return; }
    case "changeGame": { const k = S.mode; goHome(); U.pick = k; U.screen = "home"; render(); return; }
    case "nudge": { const g = S.g; act({ type: "dlMove", v: clamp(g.dial + Number(v), 0, 100) }); return; }

    /* ---- pass-mode settings before a game exists ---- */
    case "set":
      if (!S) {
        const k = el.dataset.k, d = DEFAULTS[U.pick][k];
        U.sets[U.pick][k] = typeof d === "boolean" ? v === "true" : Number(v);
        if (U.pick === "rank" && k === "rounds") U.sets.rank.hearts = heartOpts(Number(v))[1];
        store.set("nunchi-sets", U.sets); render(); return;
      }
      act({ type: "set", k: el.dataset.k, v }); return;

    /* ---- game actions (go through the host) ---- */
    case "setMode": U.sheet = null; act({ type: "setMode", v }); return;
    case "luAns": {
      const raw = U.drafts["ans-" + v] ?? "";
      if (!String(raw).trim() || !isFinite(Number(String(raw).replace(/,/g, "")))) { toast("Enter a number"); return; }
      act({ type: "luAns", v, val: raw }); delete U.drafts["ans-" + v]; scrollTo(0, 0); return;
    }
    case "dlClue": act({ type: "dlClue", val: U.drafts.clue || "" }); U.drafts.clue = ""; U.psyShow = false; return;
    case "drop": ask(`Remove ${nm(v)} from this game?`, "Remove", "yesDrop", v); return;
    case "yesDrop": U.sheet = null; act({ type: "drop", v }); return;
    case "lobby": U.sheet = null; act({ type: "lobby" }); return;
    case "rkSeen": case "rkDeal": case "dlNext": case "luNext": case "rkNext":
      act({ type: a, v }); scrollTo(0, 0); return;
    default: act({ type: a, v });
  }
}

/* ================= boot ================= */
// test hook: lets automated checks read state (harmless in normal play)
window.__nunchi = { get S() { return S; }, get ME() { return ME; }, get ROLE() { return ROLE; } };
render();
// reloaded a tab that was already in this room? slip straight back in
if (U.joinCode && tabStore.get("nunchi-pid-" + U.joinCode) && U.name) doJoin(U.joinCode, U.name);
})();
</script>
